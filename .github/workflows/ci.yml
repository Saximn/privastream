name: CI

# Keeps the main branch runnable by validating every change that targets it.
# The jobs below are intended to be configured as required status checks in the
# repository's branch protection rules (see .github/BRANCH_PROTECTION.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: python -m pip install --upgrade pip flake8

      - name: Check for Python syntax errors and undefined names
        # These checks catch issues that would make the main branch unrunnable.
        run: |
          python -m flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --extend-ignore=F824 \
            --show-source \
            --statistics \
            --exclude=.git,__pycache__,node_modules,.next,build,dist,venv

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run tests
        run: python -m pytest src/tests -v --override-ini "addopts="
