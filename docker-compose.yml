services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - gunicorn
      - -k
      - eventlet
      - -w
      - "1"
      - --bind
      - 0.0.0.0:5000
      - src.web.backend.wsgi_backend:app
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      SOCKETIO_ASYNC_MODE: eventlet
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MEDIASOUP_SERVER_URL: ${PUBLIC_SFU_URL:-http://localhost:3001}
      ROOM_TTL_SECONDS: ${ROOM_TTL_SECONDS:-21600}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - privastream-network

  video-filter-api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - gunicorn
      - --workers
      - ${VIDEO_API_WORKERS:-1}
      - --threads
      - ${VIDEO_API_THREADS:-8}
      - --timeout
      - "120"
      - --bind
      - 0.0.0.0:5001
      - src.web.backend.wsgi_video_filter:app
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ROOM_EMBEDDING_TTL_SECONDS: ${ROOM_EMBEDDING_TTL_SECONDS:-21600}
      VIDEO_FILTER_MAX_CONCURRENT_REQUESTS: ${VIDEO_FILTER_MAX_CONCURRENT_REQUESTS:-10}
      VIDEO_FILTER_MAX_REQUEST_AGE_MS: ${VIDEO_FILTER_MAX_REQUEST_AGE_MS:-1000}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./src/models:/app/src/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - privastream-network

  mediasoup:
    build:
      context: .
      dockerfile: Dockerfile.mediasoup
    ports:
      - "3001:3001"
      - "40000-40100:40000-40100/udp"
    environment:
      NODE_ENV: production
      PORT: 3001
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:?Set MEDIASOUP_ANNOUNCED_IP in .env}
      BACKEND_URL: http://backend:5000
      SFU_URL: http://mediasoup:3001
      VIDEO_API_URL: http://video-filter-api:5001
      AUDIO_API_URL: ${AUDIO_API_URL:-http://host.docker.internal:5002}
    depends_on:
      backend:
        condition: service_healthy
      video-filter-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - privastream-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:5000}
      NEXT_PUBLIC_SFU_URL: ${NEXT_PUBLIC_SFU_URL:-http://localhost:3001}
      NEXT_PUBLIC_VIDEO_API_URL: ${NEXT_PUBLIC_VIDEO_API_URL:-http://localhost:5001}
      NEXT_PUBLIC_AUDIO_API_URL: ${NEXT_PUBLIC_AUDIO_API_URL:-http://localhost:5002}
    depends_on:
      backend:
        condition: service_healthy
      mediasoup:
        condition: service_healthy
      video-filter-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - privastream-network

networks:
  privastream-network:
    driver: bridge
